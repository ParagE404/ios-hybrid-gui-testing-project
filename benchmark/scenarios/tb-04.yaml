# Errands testbed scenario. Origin: original, 
# Scripted locators follow D-011 (developer id, else XPath on a unique name, else positional XPath).
# VERIFY every locator and label against real page source from the simulator before the freeze.
id: tb-04
app: testbed
title: Turn off 'Show completed' in Settings
pilot: false
category: 2
expected_outcome: Scripted fails at the toggle (moved and relabelled by restructuring); a11y matches the first label
  segment.
initial_state:
  launch_args:
  - -resetData
steps:
- step: Tap the 'Settings' tab
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Settings"]
  oracle:
    type: Button
    label: Settings
  screen: list
- step: Toggle the 'Show completed' switch
  scripted:
    strategy: xpath
    value: //XCUIElementTypeSwitch[@name="Show completed"]
  oracle:
    type: Switch
    label_contains: Show completed
  screen: settings
- step: Tap the 'List' tab
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="checklist"]
  oracle:
    type: Button
    label: List
  screen: settings
postconditions:
- check: absent
  element:
    label_contains: Stamps
- check: exists
  element:
    label_contains: Milk
perturbation:
  kind: hierarchy_restructure
  description: New 'Display' section inserted above; 'Show completed' moved into it with a subtitle
  launch_args:
  - -perturb
  - tb04_section_inserted
