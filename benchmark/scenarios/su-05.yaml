# SyncUps scenario. Origin: original, 
# Written 18 Oct 2026 BEFORE any formal results were viewed (D-018). expected_outcome is a prediction.
# Scripted locators follow D-011 against the baseline page source. Perturbations: docs/external-perturbations.md.
# Steps marked VERIFY have no captured screen yet; check them against page source before the batch.
id: su-05
app: syncups
title: Create a sync-up called 'Planning'
pilot: false
category: 3
expected_outcome: Scripted fails at step 3; a11y finds no 'Add' on the sheet (fallback); hybrid may recover if ShowUI maps
  'Add' to 'Done'.
initial_state:
  launch_args:
  - -resetData
steps:
- step: Tap the 'Add' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="plus"]
  oracle:
    type: Button
    label: Add
  screen: list
- step: Type 'Planning' into the 'Title' field
  scripted:
    strategy: xpath
    value: (//XCUIElementTypeTextField)[1]
  oracle:
    type: TextField
    value: Title
  screen: new_syncup
- step: Tap the 'Add' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Add"]
  oracle:
    type: Button
    name: Add
  oracle_perturbed:
    type: Button
    name: Done
  screen: new_syncup
postconditions:
- check: exists
  element:
    label_contains: Planning
perturbation:
  kind: generic_label
  description: The new sync-up sheet's confirm button 'Add' is relabelled 'Done' (visible text and label)
  launch_args:
  - -perturb
  - su05_confirm_relabelled
