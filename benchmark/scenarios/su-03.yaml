# SyncUps scenario. Origin: original, 
# Written 18 Oct 2026 BEFORE any formal results were viewed (D-018). expected_outcome is a prediction.
# Scripted locators follow D-011 against the baseline page source. Perturbations: docs/external-perturbations.md.
# Steps marked VERIFY have no captured screen yet; check them against page source before the batch.
id: su-03
app: syncups
title: Create 'Standup' with attendee 'Alex'
pilot: false
category: 2
expected_outcome: Scripted types into the wrong fields and fails the postcondition; a11y and hybrid succeed via placeholders.
initial_state:
  launch_args:
  - -resetData
steps:
- step: Tap the 'Add' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="plus"]
  oracle:
    type: Button
    label: Add
  screen: list
- step: Type 'Standup' into the 'Title' field
  scripted:
    strategy: xpath
    value: (//XCUIElementTypeTextField)[1]
  oracle:
    type: TextField
    value: Title
  screen: new_syncup
- step: Type 'Alex' into the 'Name' field
  scripted:
    strategy: xpath
    value: (//XCUIElementTypeTextField)[2]
  oracle:
    type: TextField
    value: Name
  screen: new_syncup
- step: Tap the 'Add' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Add"]
  oracle:
    type: Button
    name: Add
  screen: new_syncup
postconditions:
- check: exists
  element:
    label_contains: Standup, 1,
perturbation:
  kind: hierarchy_insertion
  description: A 'Notes' section with one TextField (placeholder 'Notes') is inserted above 'Sync-up Info' in the new sync-up
    form; positional field locators shift
  launch_args:
  - -perturb
  - su03_notes_section_inserted
