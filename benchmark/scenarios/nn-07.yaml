id: nn-07
app: netnewswire
title: Add a folder called 'Gaming'
pilot: false
category: 4
expected_outcome: Scripted and a11y fail at step 1; hybrid is the only route.
initial_state:
  launch_args:
  - -resetData
steps:
- step: Tap the 'Add' button
  scripted:
    strategy: accessibility_id
    value: addButton
  oracle:
    type: Button
    label: Add
  oracle_perturbed:
    type: Button
    name: button_5
  screen: feeds
- step: Tap the 'Add Folder' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Add Folder"]
  oracle:
    type: Button
    label: Add Folder
  screen: add_menu
- step: Type 'Gaming' into the 'Name' field
  scripted:
    strategy: xpath
    value: (//XCUIElementTypeTextField)[1]
  oracle:
    type: TextField
  screen: add_folder
- step: Tap the 'Add' button
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Add"]
  oracle:
    type: Button
    name: Add
  screen: add_folder
postconditions:
- check: exists
  element:
    type: Cell
    label_contains: Gaming
perturbation:
  kind: weak_metadata
  description: Toolbar Add button becomes an unlabelled bitmap plus icon (no label), identifier 'button_5'
  launch_args:
  - -perturb
  - nn07_add_icon_unlabelled
