id: f-11
app: testbed
title: 'Turn off ''Show completed'' in Settings [fault: f11_show_completed_first_lure]'
pilot: false
category: 2
expected_outcome: No false pass. a11y and hybrid are predicted to toggle 'Show completed first' structurally (score
  about 0.87); 'Stamps' stays visible, so the postcondition catches it. Scripted is masked at step 0 in both conditions.
fault:
  flag: f11_show_completed_first_lure
  class: lure
  base_scenario: tb-04
  description: The 'Show completed' switch is removed; a 'Show completed first' switch (moves completed items to
    the top) takes its place.
  fault_step: 1
  observed_by:
  - postcondition 0 (absent 'Stamps')
  postconditions_can_observe: true
  expected:
    scripted:
      baseline: 'fragility (masked: fails as the fault-free formal run did) at step 0'
      perturbed: 'fragility (masked: fails as the fault-free formal run did) at step 0'
    a11y:
      baseline: detection at postcondition, after toggling the substitute 'Show completed first'
      perturbed: detection at postcondition, after toggling the substitute
    hybrid:
      baseline: detection at postcondition, after toggling the substitute
      perturbed: detection at postcondition, after toggling the substitute
initial_state:
  launch_args:
  - -resetData
  - -fault
  - f11_show_completed_first_lure
steps:
- step: Tap the 'Settings' tab
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Settings"]
  oracle:
    type: Button
    label: Settings
  screen: list
- step: Toggle the 'Show completed' switch
  scripted:
    strategy: xpath
    value: //XCUIElementTypeSwitch[@name="Show completed"]
  oracle:
    type: Switch
    label: Show completed
  oracle_perturbed:
    type: Switch
    label: Show completed, Includes finished errands
  screen: settings
- step: Tap the 'List' tab
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="checklist"]
  oracle:
    type: Button
    label: List
  screen: settings
postconditions:
- check: absent
  element:
    label_contains: Stamps
- check: exists
  element:
    label_contains: Milk
perturbation:
  kind: hierarchy_restructure
  description: New 'Display' section inserted above; 'Show completed' moved into it with a subtitle
  launch_args:
