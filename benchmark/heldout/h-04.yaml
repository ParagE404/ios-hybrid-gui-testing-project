# Origin: AI-scaffolded and rewritten by the author. Held-out evaluation design was defined by the author.
# Held-out scenario for engine v2 (workstream C, D-029). Written 2026-11-17 BEFORE any v2 code and before any run.
# Not derived from SU-03, SU-05 or SU-07 screens or controls. The scripted configuration is not run;
# its locators exist only because the scenario loader requires them.
id: h-04
app: testbed
title: Add 'Tea' with an icon-only confirm button
pilot: false
category: 4
expected_outcome: 'a11y-v1: fail at step 2; hybrid-v1: fail at step 2; a11y-v2: fail at step 2; hybrid-v2: complete
  if ShowUI grounds the unlabelled control'
heldout:
  class: hidden_candidate
  mechanism: 'Held-out flag h04_add_confirm_icon: the add form''s Save becomes an unlabelled checkmark (id button_21).
    The step says ''Add''; the only text match is the list''s ''Add item'' button, hidden behind the sheet.'
  configurations:
  - a11y-v1
  - hybrid-v1
  - a11y-v2
  - hybrid-v2
  conditions:
  - baseline
  - perturbed
  outcome_measure: runner completion (as in the formal experiment)
  expected:
    a11y-v1:
      baseline: 'fail at step 2: the only candidate is the hidden ''Add item'' (score 0, incompatible_state); a11y
        has no action'
      perturbed: 'fail at step 2: the only candidate is the hidden ''Add item'' (score 0, incompatible_state); a11y
        has no action'
    hybrid-v1:
      baseline: 'fail at step 2: the VLM point on the unlabelled control is rejected as outside_candidate_set (twice);
        no valid best-effort candidate'
      perturbed: 'fail at step 2: the VLM point on the unlabelled control is rejected as outside_candidate_set (twice);
        no valid best-effort candidate'
    a11y-v2:
      baseline: 'fail at step 2: the only candidate is the hidden ''Add item'' (score 0, incompatible_state); a11y
        has no action (no VLM, so v2 cannot help)'
      perturbed: 'fail at step 2: the only candidate is the hidden ''Add item'' (score 0, incompatible_state); a11y
        has no action (no VLM, so v2 cannot help)'
    hybrid-v2:
      baseline: 'complete if ShowUI grounds the unlabelled control: relax_candidate_set lets the VLM point through
        because every candidate scores 0 (uncertain: depends on grounding)'
      perturbed: 'complete if ShowUI grounds the unlabelled control: relax_candidate_set lets the VLM point through
        because every candidate scores 0 (uncertain: depends on grounding)'
initial_state:
  launch_args:
  - -resetData
  - -perturb
  - h04_add_confirm_icon
steps:
- step: Tap the 'Add item' button
  scripted:
    strategy: accessibility_id
    value: addItemButton
  oracle:
    label: Add item
  screen: list
- step: Type 'Tea' into the 'Item name' field
  scripted:
    strategy: accessibility_id
    value: itemNameField
  oracle:
    type: TextField
  screen: add_form
- step: Tap the 'Add' button
  scripted:
    strategy: accessibility_id
    value: button_21
  oracle:
    type: Button
    name: button_21
  screen: add_form
postconditions:
- check: exists
  element:
    label_contains: Tea
perturbation:
  kind: identifier_rename
  description: List Add button id addItemButton -> addButton_v2 (existing tb-01 flag; cosmetic here)
  launch_args:
  - -perturb
  - tb01_add_id_renamed
