# Held-out scenario for engine v2 (workstream C, D-029). Written 2026-11-17 BEFORE any v2 code and before any run.
# Not derived from SU-03, SU-05 or SU-07 screens or controls. The scripted configuration is not run;
# its locators exist only because the scenario loader requires them.
id: h-06
app: testbed
title: Mark 'Bread' urgent and confirm with an icon-only button
pilot: false
category: 4
expected_outcome: 'a11y-v1: fail at step 3; hybrid-v1: fail at step 3; a11y-v2: fail at step 3; hybrid-v2: complete
  if ShowUI grounds the unlabelled control'
heldout:
  class: hidden_candidate
  mechanism: 'Held-out flag h06_edit_confirm_icon: the edit form''s Save becomes an unlabelled checkmark (id button_22).
    The step says ''Done''; the only text match is the detail page''s ''Mark as done'' button, hidden behind the
    sheet.'
  configurations:
  - a11y-v1
  - hybrid-v1
  - a11y-v2
  - hybrid-v2
  conditions:
  - baseline
  - perturbed
  outcome_measure: runner completion (as in the formal experiment)
  expected:
    a11y-v1:
      baseline: 'fail at step 3: the only candidate is the hidden ''Mark as done'' (score 0, incompatible_state);
        a11y has no action'
      perturbed: 'fail at step 3: the only candidate is the hidden ''Mark as done'' (score 0, incompatible_state);
        a11y has no action'
    hybrid-v1:
      baseline: 'fail at step 3: the VLM point on the unlabelled control is rejected as outside_candidate_set (twice);
        no valid best-effort candidate'
      perturbed: 'fail at step 3: the VLM point on the unlabelled control is rejected as outside_candidate_set (twice);
        no valid best-effort candidate'
    a11y-v2:
      baseline: 'fail at step 3: the only candidate is the hidden ''Mark as done'' (score 0, incompatible_state);
        a11y has no action (no VLM, so v2 cannot help)'
      perturbed: 'fail at step 3: the only candidate is the hidden ''Mark as done'' (score 0, incompatible_state);
        a11y has no action (no VLM, so v2 cannot help)'
    hybrid-v2:
      baseline: 'complete if ShowUI grounds the unlabelled control: relax_candidate_set lets the VLM point through
        because every candidate scores 0 (uncertain: depends on grounding)'
      perturbed: 'complete if ShowUI grounds the unlabelled control: relax_candidate_set lets the VLM point through
        because every candidate scores 0 (uncertain: depends on grounding)'
initial_state:
  launch_args:
  - -resetData
  - -perturb
  - h06_edit_confirm_icon
steps:
- step: Tap the 'Bread' row
  scripted:
    strategy: xpath
    value: //XCUIElementTypeButton[@name="Bread, Qty 1"]
  oracle:
    type: Button
    label_contains: Bread,
  screen: list
- step: Tap the 'Edit' button
  scripted:
    strategy: accessibility_id
    value: editButton
  oracle:
    label: Edit
  screen: detail
- step: Toggle the 'Urgent' switch
  scripted:
    strategy: accessibility_id
    value: urgentToggle
  oracle:
    type: Switch
    label: Urgent
  screen: edit_form
- step: Tap the 'Done' button
  scripted:
    strategy: accessibility_id
    value: button_22
  oracle:
    type: Button
    name: button_22
  screen: edit_form
postconditions:
- check: exists
  element:
    label: Urgent item
perturbation:
  kind: hierarchy_insertion
  description: Pinned section and row captions (existing tb-03 flag; 'Bread, Qty 1' becomes 'Bread, Food, Qty 1')
  launch_args:
  - -perturb
  - tb03_rows_wrapped
