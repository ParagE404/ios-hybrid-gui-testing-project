[project]
name = "ios-hybrid-testing"
version = "0.1.0"
description = "Accessibility-first hybrid framework for intent-driven native iOS GUI testing (MSc project)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
appium = ["Appium-Python-Client>=4"]
vlm = ["torch", "torchvision", "transformers>=4.45", "accelerate", "qwen-vl-utils", "pillow"]
dev = ["pytest>=8"]
analysis = ["numpy", "pandas", "scipy", "matplotlib", "tabulate"]
mcp = ["mcp>=2.3,<3", "anyio"]

[tool.setuptools]
packages = ["engine", "engine.vlm", "mcp_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
