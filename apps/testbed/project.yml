# XcodeGen spec for the Errands testbed app.
# Origin: original, 
# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Errands
options:
  bundleIdPrefix: uk.ac.city.parag
  deploymentTarget:
    iOS: "17.0"
targets:
  Errands:
    type: application
    platform: iOS
    sources: [Errands]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ac.city.parag.Errands
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Errands
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO   # simulator-only builds need no signing
# App update
